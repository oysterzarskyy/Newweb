name: "lint"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Python version
        id: python-version
        run: |
          if [ -f .python-version ]; then
            echo "VERSION=(cat .python-version)" >> GITHUB_OUTPUT
          else
            echo "VERSION=3.10" >> \$GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: \${{ steps.python-version.outputs.VERSION }}

      - name: Run lint script
        id: run-lint
        continue-on-error: true
        run: python scripts/lint.py

      - name: Create Issue on Failure
        if: steps.run-lint.outcome == 'failure'
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the error log file into a variable
          ERROR_REPORT=\$(cat lint_errors.log)

          # Construct a dynamic issue body
          ISSUE_BODY=\$(cat <<EOF
          The pure-Python linting check failed during the workflow run.

          ### 🚨 Discovered Code Errors:
          \$ERROR_REPORT

          _Run triggered by: @\${{ github.actor }} on branch \`${{ github.ref_name }}\`._
          EOF
          )

          # Generate localized label names based on GitHub Run variables
          LABEL_GH="gh-\${{ github.run_number }}"
          LABEL_BUG="bug-\${{ github.run_attempt }}"

          # Use GitHub CLI to create the issue with the specific labels
          gh issue create \
            --title "⚠️ Linting Failed on \${{ github.ref_name }}" \
            --body "\$ISSUE_BODY" \
            --label "\$LABEL_GH" \
            --label "\$LABEL_BUG"

          # Hard fail the step so the action logs reflect the build failure
          exit 1
