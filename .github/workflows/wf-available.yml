name: WorkflowsCheck

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so commit messages are available

      - name: Check for workflows folder
        id: check_dir
        run: |
          if [ -d ".github/workflows" ]; then
            # Get the latest commit message/name
            COMMIT_NAME=$(git log -1 --format=%s)
            echo "result=$COMMIT_NAME" >> $GITHUB_OUTPUT
            echo "Found workflows. Commit: $COMMIT_NAME"
          else
            echo "result=false" >> $GITHUB_OUTPUT
            echo "Workflows folder not found. Result: false"
          fi

      # Optional: Example of how to use the output in a later step
      - name: Use the result
        run: |
          echo "The final result is: ${{ steps.check_dir.outputs.result }}"
